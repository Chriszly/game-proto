<text x="736" y="46" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start" dominant-baseline="middle">9</text>
<g><rect x="24" y="104" width="912" height="576" rx="8" fill="#cdb98f" stroke="#1f2933" stroke-width="2"/><rect x="91.92000000000002" y="372" width="40" height="48" rx="10" fill="#8a6d3b" stroke="#1f2933" stroke-width="2"/><text x="111.92000000000002" y="432" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Hero</text><rect x="296.8" y="336" width="24" height="120" rx="4" fill="#a48a5a" stroke="#1f2933" stroke-width="2"/><text x="308.8" y="440" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Wall</text><circle cx="565.6" cy="396" r="14" fill="#6f8f4e" stroke="#1f2933" stroke-width="2"/><text x="565.6" y="422" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Orc</text><circle cx="685.4399999999999" cy="396" r="14" fill="#6f8f4e" stroke="#1f2933" stroke-width="2"/><text x="685.4399999999999" y="422" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Orc</text><circle cx="822.4" cy="396" r="30" fill="#55664a" stroke="#1f2933" stroke-width="2"/><text x="822.4" y="440" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle" dominant-baseline="middle">Troll</text></g>
<text x="24" y="60" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5b6670" text-anchor="start" dominant-baseline="middle">Concept mockup, not game code. Clean vector direction.</text>
<rect x="960" y="72" width="320" height="648" fill="#ffffff"/>
<rect x="960" y="72" width="2" height="648" fill="#5b6670" opacity="0.3"/>
<text x="984" y="108" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5b6670" text-anchor="start" dominant-baseline="middle">ON SCREEN</text>
<text x="984" y="138" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Level up: pick one of three</text>
<text x="984" y="168" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Volley, piercing, mend</text>
<text x="984" y="198" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Skill book</text>
<text x="984" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Best wave: 14</text>
<rect x="976" y="446" width="288" height="2" fill="#8a6d3b"/>
<text x="984" y="470" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#8a6d3b" text-anchor="start" dominant-baseline="middle">PROPOSED LOOP CHANGE</text>
<text x="984" y="500" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Progress is saved on every</text>
<text x="984" y="524" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   kill, not only at level-ups</text>
<text x="984" y="556" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Always three choices, with a</text>
<text x="984" y="580" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   gold fallback</text>
<text x="984" y="612" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  The troll every tenth wave</text>
<text x="984" y="636" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   shows its health bars</text>
</svg>
