<text x="24" y="60" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5b6670" text-anchor="start" dominant-baseline="middle">Concept mockup, not game code. Clean vector direction.</text>
<text x="24" y="60" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5b6670" text-anchor="start" dominant-baseline="middle">Portrait game: shown in a phone-width column.</text>
<rect x="960" y="72" width="320" height="648" fill="#ffffff"/>
<rect x="960" y="72" width="2" height="648" fill="#5b6670" opacity="0.3"/>
<text x="984" y="108" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5b6670" text-anchor="start" dominant-baseline="middle">ON SCREEN</text>
<text x="984" y="138" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Crate: pick one of three</text>
<text x="984" y="168" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Rapid fire, damage, companion,</text>
<text x="984" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   pierce</text>
<text x="984" y="222" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Boss in two waves</text>
<text x="984" y="252" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Best wave: 21</text>
<rect x="976" y="446" width="288" height="2" fill="#6d7d3a"/>
<text x="984" y="470" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#6d7d3a" text-anchor="start" dominant-baseline="middle">PROPOSED LOOP CHANGE</text>
<text x="984" y="500" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  After each wave, pick one of</text>
<text x="984" y="524" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   three upgrades instead of a</text>
<text x="984" y="548" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   random crate</text>
<text x="984" y="580" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  The boss telegraphs its charge</text>
<text x="984" y="604" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   a second early</text>
<text x="984" y="636" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Best wave and score are kept</text>
<text x="984" y="660" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   between runs</text>
</svg>
