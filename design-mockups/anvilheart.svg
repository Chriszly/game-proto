<text x="984" y="470" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b5651d" text-anchor="start" dominant-baseline="middle">PROPOSED LOOP CHANGE</text>
<text x="984" y="500" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Each adventurer asks for an</text>
<text x="984" y="524" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">   exact tier</text>
<text x="984" y="556" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Overselling pays a fine, not</text>
