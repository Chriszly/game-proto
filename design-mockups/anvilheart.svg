<text x="984" y="138" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Adventurers at the counter</text>
<text x="984" y="168" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" dominant-baseline="middle">•  Asks: Tier 3 blade, pays 90</text>
