# Weekly npm and monthly GitHub Actions and Docker update PRs. Minor and patch
# updates of each kind come grouped in one PR; a major update gets its own. Each
# PR carries a Type and a Game label from .github/labels.json, so the
# type-and-game check passes. PR Links and the template check skip Dependabot's
# PRs, whose descriptions and commits quote release notes from other sites.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [refactor, shared]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ci, shared]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [ci, shared]
