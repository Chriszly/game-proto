name: Projects

# Keeps one GitHub Project per game (plus hub, shared and "All feedback") in line
# with .github/projects.json, and files each issue and PR into "All feedback" and
# its Game label's Project. Needs the repo secret PROJECTS_TOKEN: a classic token
# with the "project" and "repo" scopes, since the workflow token can't reach
# user-owned Projects. Without it the workflow does nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/projects.json, .github/workflows/projects.yml]
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [opened, labeled, reopened]

permissions:
  contents: read

jobs:
  projects:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PROJECTS_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::PROJECTS_TOKEN is not set, so the Projects are not created or filled."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/projects.json
          sparse-checkout-cone-mode: false
      - name: Set up or fill the Projects
        if: env.HAS_TOKEN == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const wanted = JSON.parse(require('fs').readFileSync('.github/projects.json', 'utf8'));
            const { owner, repo } = context.repo;
            const { user, repository } = await github.graphql(`
              query($owner: String!, $repo: String!) {
                user(login: $owner) { id projectsV2(first: 100) { nodes { id title } } }
                repository(owner: $owner, name: $repo) { id }
              }`, { owner, repo });
            const byTitle = new Map(user.projectsV2.nodes.map(p => [p.title, p.id]));

            const item = context.payload.issue || context.payload.pull_request;
            if (!item) {
              // Setup run: create missing Projects, then set their texts and link them to the repo.
              for (const p of wanted) {
                let id = byTitle.get(p.title);
                if (!id) {
                  const created = await github.graphql(`
                    mutation($ownerId: ID!, $title: String!, $repositoryId: ID!) {
                      createProjectV2(input: { ownerId: $ownerId, title: $title, repositoryId: $repositoryId }) {
                        projectV2 { id }
                      }
                    }`, { ownerId: user.id, title: p.title, repositoryId: repository.id });
                  id = created.createProjectV2.projectV2.id;
                  console.log(`Created ${p.title}`);
                }
                // Public Projects are view-only for everyone but the owner and invited collaborators.
                await github.graphql(`
                  mutation($projectId: ID!, $shortDescription: String!, $readme: String!) {
                    updateProjectV2(input: { projectId: $projectId, shortDescription: $shortDescription, readme: $readme, public: true }) {
                      projectV2 { id }
                    }
                  }`, { projectId: id, shortDescription: p.shortDescription, readme: p.readme });
                await github.graphql(`
                  mutation($projectId: ID!, $repositoryId: ID!) {
                    linkProjectV2ToRepository(input: { projectId: $projectId, repositoryId: $repositoryId }) {
                      repository { id }
                    }
                  }`, { projectId: id, repositoryId: repository.id });
                console.log(`Updated ${p.title}`);
              }
              return;
            }

            // Issue or PR: add it to "All feedback" and to each of its Game labels' Projects.
            // Adding an item that is already in a Project changes nothing.
            const labels = new Set(item.labels.map(l => l.name));
            const targets = wanted.filter(p => p.label === null || labels.has(p.label));
            for (const p of targets) {
              const projectId = byTitle.get(p.title);
              if (!projectId) {
                core.warning(`Project "${p.title}" doesn't exist yet; run this workflow by hand to create it.`);
                continue;
              }
              await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
                }`, { projectId, contentId: item.node_id });
              console.log(`Added #${item.number} to ${p.title}`);
            }
