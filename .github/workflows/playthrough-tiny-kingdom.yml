name: Playthrough Tiny Kingdom

# Plays Tiny Kingdom's first round. Runs only when the game's own folder (or this
# workflow) changes; every game has its own playthrough-<name>.yml like this one.
# It runs on pull requests only, not on pushes to main, so a merge doesn't replay it.
on:
  pull_request:
    paths:
      - games/tiny-kingdom/**
      - .github/workflows/playthrough-tiny-kingdom.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playthrough-tiny-kingdom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Plays the first round in headless Chromium at 4x speed.
      - run: npx playwright test --project tiny-kingdom
        env:
          PLAYTHROUGH_SPEED: 4
      # Video and milestone screenshots of the run, pass or fail; open the report's index.html to browse them.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-tiny-kingdom
          path: |
            test-results
            playwright-report
          retention-days: 14
