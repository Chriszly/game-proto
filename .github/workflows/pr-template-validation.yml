name: PR Template Validation

on:
  pull_request:
    # "labeled" and "unlabeled" re-run the label check when the PR's labels change.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  validate-pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body matches template
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The PR is fetched fresh, as a re-run of an older run would otherwise
            // check the description it started with.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number
            });
            // Dependabot writes its own description, without the template.
            if (pr.user.login === 'dependabot[bot]') {
              console.log('Dependabot PR, template not checked.');
              return;
            }
            const body = pr.body || '';
            const requiredSections = [
              '## Summary',
              '## Checklist',
              '## Testing'
            ];

            const heading = (section) => new RegExp(`^${section}(?: |\r?$|:|\n)`, 'm');
            const missing = requiredSections.filter(section => !heading(section).test(body));

            if (missing.length > 0) {
              core.setFailed(`PR description is missing required sections: ${missing.join(', ')}. Please use the PR template.`);
            } else {
              console.log('PR template validation passed.');
            }

  # Every PR needs at least one Type label (what kind of change) and at least one
  # Game label (which game, or hub / shared), and only labels listed in the PR's
  # .github/labels.json, so a PR that adds a game can carry its new game label.
  type-and-game:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/labels.json
          sparse-checkout-cone-mode: false
      - name: Check the PR has a type and a game label and no unknown labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The labels are fetched fresh, as a re-run of an older run would
            // otherwise check the labels it started with.
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });
            const names = labels.map(l => l.name);
            // A label's group is the start of its description in labels.json, e.g. "Type: ...".
            const groupOf = new Map(
              JSON.parse(require('fs').readFileSync('.github/labels.json', 'utf8'))
                .map(l => [l.name, l.description.split(':')[0]]));
            const unknown = names.filter(n => !groupOf.has(n));
            const missing = ['Type', 'Game']
              .filter(group => !names.some(n => groupOf.get(n) === group))
              .map(group => `a ${group} label`);
            const problems = [];
            if (missing.length > 0) {
              problems.push(`PR needs ${missing.join(' and ')}. Pick them under Labels; ` +
                'the type says what changed (bug, feature, gameplay, refactor, assets, docs, ci) ' +
                'and the game says where (a game, hub or shared).');
            }
            if (unknown.length > 0) {
              problems.push(`PR has labels that are not in .github/labels.json: ${unknown.join(', ')}. ` +
                'Remove them; new labels are only allowed for a new game, added to that file in the same PR.');
            }
            if (problems.length > 0) {
              core.setFailed(problems.join('\n'));
            } else {
              console.log(`PR labels: ${names.join(', ')}`);
            }
