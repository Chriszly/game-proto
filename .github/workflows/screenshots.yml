name: Screenshots

# Keeps the images a PR commits small, since every one stays in the history and in every clone:
# screenshots are WebP files of at most 200 KB, other images at most 500 KB, none over 1280 pixels,
# and at most 4 new screenshots per PR (scripts/check-screenshots.mjs, rules in AGENTS.md).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node scripts/check-screenshots.mjs ${{ github.event.pull_request.base.sha }}
