name: Hub

# Checks that the hub lists every game and each card opens it, and that the games using
# shared/scaling.ts fit every screen. Runs when the hub page, its tests, a game's entry page,
# main.ts, cover or favicon, or a shared file changes.
on:
  push:
    branches: [main]
    paths: &paths
      - index.html
      - favicon.svg
      - e2e/**
      - games/*/index.html
      - games/*/src/main.ts
      - games/*/cover.png
      - games/*/favicon.svg
      - shared/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.e2e.json
      - vite.config.ts
      - playwright.config.ts
      - .github/workflows/hub.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    # Each game on shared/scaling.ts adds five screen checks, about a minute and a half, and more
    # games move over one PR at a time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # One at a time: the screen checks draw up to 4K in software and, run alongside, starve the
      # hub test's dev server so a game page loads too slowly.
      - run: npx playwright test --project hub --workers 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub
          path: |
            test-results
            playwright-report
          retention-days: 14
