name: Hub

# Checks that the hub lists every game, that its settings reach the games and that each card opens
# its game. Opening a game is one job per game: on a pull request only the games whose folder changed
# are opened, and every game when the hub page, its test, shared/, this workflow or the build setup
# changes. Main isn't checked again after the merge. The screen checks of the games using shared/scaling.ts
# run in the Screens workflow. The Hub open job turns the open jobs into one check that can be required.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    # Installing the browser's system packages can take most of 10 minutes on a slow Ubuntu mirror.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Everything but opening each game, which the open jobs below do one game at a time.
      - run: npx playwright test --project=hub e2e/hub.spec.ts --grep-invert "hub opens "
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub
          path: |
            test-results
            playwright-report
          retention-days: 14

  changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(cd games && for d in */; do echo "${d%/}"; done)
          if [ -z "$BASE" ]; then
            changed=$all # workflow_dispatch: open every game
          else
            files=$(git diff --name-only "$BASE" HEAD)
            if echo "$files" | grep -qE '^(index\.html$|favicon\.svg$|e2e/hub\.spec\.ts$|shared/|\.github/workflows/hub\.yml$|package(-lock)?\.json$|tsconfig(\.e2e)?\.json$|playwright\.config\.ts$|vite\.config\.ts$)'; then
              changed=$all
            else
              changed=$(for g in $all; do if echo "$files" | grep -q "^games/$g/"; then echo "$g"; fi; done)
            fi
          fi
          json=$(printf '%s\n' $changed | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Opening: $json"
          echo "games=$json" >> "$GITHUB_OUTPUT"

  open:
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    # Installing the browser's system packages can take most of 10 minutes on a slow Ubuntu mirror.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=hub e2e/hub.spec.ts --grep "hub opens "
        env:
          HUB_GAME: ${{ matrix.game }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub-open-${{ matrix.game }}
          path: |
            test-results
            playwright-report
          retention-days: 14

  # One check for opening every game, failing when the picker or any game's job failed.
  result:
    name: Hub open
    needs: [changes, open]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that no opened game failed
        env:
          CHANGES: ${{ needs.changes.result }}
          OPEN: ${{ needs.open.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "Choosing the games to open failed."; exit 1; fi
          if [ "$OPEN" != success ] && [ "$OPEN" != skipped ]; then echo "A game failed to open from its card; see the open jobs."; exit 1; fi
          echo "Every game opened."
