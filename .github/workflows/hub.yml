name: Hub

# Checks that the hub lists every game, that its settings reach the games and that each card opens
# its game. Opening a game is one job per game: on a pull request only the games whose folder changed
# are opened, and every game when the hub page, its test, shared/, this workflow or the build setup
# changes. A push to main opens every game. The screen checks of the games using shared/scaling.ts
# run in the Screens workflow.
on:
  push:
    branches: [main]
    paths: &paths
      - index.html
      - favicon.svg
      - e2e/**
      - games/*/index.html
      - games/*/src/main.ts
      - games/*/cover.png
      - games/*/favicon.svg
      - shared/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.e2e.json
      - vite.config.ts
      - playwright.config.ts
      - .github/workflows/hub.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Everything but opening each game, which the open jobs below do one game at a time.
      - run: npx playwright test --project=hub e2e/hub.spec.ts --grep-invert "hub opens "
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub
          path: |
            test-results
            playwright-report
          retention-days: 14

  changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(cd games && for d in */; do echo "${d%/}"; done)
          if [ -z "$BASE" ]; then
            changed=$all # a push to main or workflow_dispatch: open every game
          else
            files=$(git diff --name-only "$BASE" HEAD)
            if echo "$files" | grep -qE '^(index\.html$|favicon\.svg$|e2e/hub\.spec\.ts$|shared/|\.github/workflows/hub\.yml$|package(-lock)?\.json$|tsconfig(\.e2e)?\.json$|playwright\.config\.ts$|vite\.config\.ts$)'; then
              changed=$all
            else
              changed=$(for g in $all; do if echo "$files" | grep -q "^games/$g/"; then echo "$g"; fi; done)
            fi
          fi
          json=$(printf '%s\n' $changed | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Opening: $json"
          echo "games=$json" >> "$GITHUB_OUTPUT"

  open:
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=hub e2e/hub.spec.ts --grep "hub opens "
        env:
          HUB_GAME: ${{ matrix.game }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub-open-${{ matrix.game }}
          path: |
            test-results
            playwright-report
          retention-days: 14
